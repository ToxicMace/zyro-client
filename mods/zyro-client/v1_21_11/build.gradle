// Zyro Client for Minecraft 1.21.11 (obfuscated game, remapped to Mojang names).
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java.srcDirs = ['../src/main/java', '../src/v1_21_11/java']
		resources.srcDirs = ['../src/main/resources']
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, mc_dep: project.mc_dep, java: project.java_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
	it.options.encoding = "UTF-8"
}

jar {
	from("../LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}
